spring:
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: true
        use_sql_comments: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  forward-headers-strategy: framework

# 컨트롤러 메서드 로깅(@LogMonitoring) 설정. 시크릿 값도 마스킹 없이 출력한다(프로젝트 결정)
chuseok22:
  logging:
    enabled: true
    mask-sensitive: false

# 인증 설정(값은 application-{dev,prod}.yml 에 둔다)
# jwt.secret-key: HS512 서명 키. Base64로 인코딩한 64바이트 이상의 값
# jwt.access-exp-millis: 액세스 토큰 수명(밀리초)
# jwt.refresh-exp-millis: 리프레시 토큰 수명(밀리초)
# jwt.issuer: 토큰 발급자(iss 클레임)
# firebase.service-account-location: Firebase 서비스 계정 JSON 위치(예: classpath:firebase-service-account.json)
