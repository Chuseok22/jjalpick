<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout/shell :: head(~{::title})}">
    <title>관리자 로그인</title>
</head>
<body>
<div th:replace="~{admin/layout/shell :: page(~{::title}, ~{::main})}">
    <main class="admin-center-screen">
        <div class="card bg-base-100 shadow-xl admin-login-card">
            <form class="card-body admin-stack" th:action="@{/admin/login}" method="post">
                <h1 class="card-title">관리자 로그인</h1>
                <div role="alert" class="alert alert-error" th:if="${param.error}">
                    <span>아이디 또는 비밀번호가 올바르지 않습니다</span>
                </div>
                <div role="alert" class="alert alert-info" th:if="${param.logout}">
                    <span>로그아웃되었습니다</span>
                </div>
                <label class="form-control">
                    <span class="label-text">아이디</span>
                    <input class="input input-bordered" type="text" name="username" autocomplete="username" required
                           autofocus>
                </label>
                <label class="form-control">
                    <span class="label-text">비밀번호</span>
                    <input class="input input-bordered" type="password" name="password"
                           autocomplete="current-password" required>
                </label>
                <button type="submit" class="btn btn-primary">로그인</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
