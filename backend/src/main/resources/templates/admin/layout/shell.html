<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">짤픽 관리자</title>
    <link rel="stylesheet" th:href="@{/webjars/daisyui/dist/full.css}">
    <link rel="stylesheet" th:href="@{/admin/assets/admin.css}">
    <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>
<body>
<div th:fragment="page(title, content)">
    <header class="navbar bg-base-200" th:if="${adminUsername != null}">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl" th:href="@{/admin}">짤픽 관리자</a>
        </div>
        <div class="admin-topbar-actions">
            <span th:text="${adminUsername}">admin</span>
            <form th:action="@{/admin/logout}" method="post">
                <button type="submit" class="btn btn-sm btn-outline">로그아웃</button>
            </form>
        </div>
    </header>
    <main th:replace="${content}">본문</main>
</div>
</body>
</html>
