# 정적 사이트(SPA) 서빙 설정. 존재하지 않는 경로는 index.html로 넘겨 클라이언트 라우팅이 동작하게 한다.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 정적 에셋은 오래 캐시한다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
